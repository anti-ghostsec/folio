# Every push to main that passes the checks publishes Folio, signed with
# minisign, as the newest release. FerroOS's updater installs it from there,
# and only if the signature checks out against Folio's public key
# (minisign.pub, built into the updater).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Folio is Python and a web page: it's checked, then packed as it is.
      - name: Check and pack
        run: |
          python3 -m py_compile folio.py
          [ -f ui/index.html ] || { echo "ui/index.html is missing" >&2; exit 1; }
          rm -rf dist && mkdir -p dist/folio
          cp -r folio.py ui icons LICENSE README.md dist/folio/
          find dist/folio -name '__pycache__' -prune -exec rm -rf {} +
          echo "$GITHUB_SHA" >dist/folio/commit
          echo "$GITHUB_SHA" >dist/folio-commit
          # Plain files and folders only, owned by nobody in particular.
          tar --owner=0 --group=0 --numeric-owner --mode=u=rwX,go=rX -C dist -czf dist/folio-linux.tar.gz folio
          (cd dist && sha256sum folio-linux.tar.gz >folio-linux.tar.gz.sha256)

      # The trusted comment names the commit and its time, so the updater
      # can tell this build is the one it was told about, and never goes
      # back to an older one.
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY isn't set: no release without a signature" >&2; exit 1; }
          sudo apt-get install -y -q minisign >/dev/null
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          when=$(git log -1 --format=%ct "$GITHUB_SHA")
          minisign -S -s "$key" -m dist/folio-linux.tar.gz -t "folio $GITHUB_SHA $when"
          # Signed with the key the updater trusts, not some other one.
          minisign -V -p minisign.pub -m dist/folio-linux.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create "build-$short" --target "$GITHUB_SHA" --latest \
            --title "Folio $short" \
            --notes "Folio, from $GITHUB_SHA. Signed with minisign: minisign -Vm folio-linux.tar.gz -P $(tail -1 minisign.pub)" \
            dist/folio-linux.tar.gz dist/folio-linux.tar.gz.sha256 \
            dist/folio-linux.tar.gz.minisig dist/folio-commit
